<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS THE FRESH 간판 안전관리 시스템</title>
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #ffffff; width: 100%; max-width: 480px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #006837; text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #006837; }
    button { width: 100%; padding: 14px; background-color: #006837; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .preview-img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    #login-section, #form-section { display: none; }
    .active { display: block !important; }
    .error-msg { color: #d9534f; font-size: 13px; margin-top: 6px; display: none; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. 로그인 화면 -->
  <div id="login-section" class="active">
    <h2>GS THE FRESH<br><small style="font-size:14px; color:#666; font-weight:normal;">간판 안전관리 시스템 로그인</small></h2>
    <div class="form-group">
      <label>아이디</label>
      <input type="text" id="login-id" placeholder="아이디를 입력하세요">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요">
    </div>
    <p id="login-error" class="error-msg">아이디 또는 비밀번호가 일치하지 않습니다.</p>
    <button onclick="handleLogin()">로그인</button>
  </div>

  <!-- 2. 점검 양식 화면 -->
  <div id="form-section">
    <h2>간판 안전점검 결과 제출</h2>
    <form id="check-form">
      <div class="form-group">
        <label>점포명</label>
        <input type="text" id="store-name" required placeholder="예: GS더프레시 강남점">
      </div>
      <div class="form-group">
        <label>점검일시</label>
        <input type="date" id="check-date" required>
      </div>
      <div class="form-group">
        <label>점검 결과</label>
        <select id="check-result" required>
          <option value="">선택하세요</option>
          <option value="양호">양호</option>
          <option value="요보수">요보수</option>
          <option value="긴급조치">긴급조치</option>
        </select>
      </div>
      <div class="form-group">
        <label>현장 사진 첨부 (미리보기 가능)</label>
        <input type="file" id="photo-input" accept="image/*" multiple onchange="previewPhotos(event)">
        <div id="preview-container"></div>
      </div>
      <div class="form-group">
        <label>특이사항</label>
        <textarea id="memo" rows="3" placeholder="내용을 입력하세요"></textarea>
      </div>
      <button type="button" id="submit-btn" onclick="submitData()">제출하기</button>
    </form>
  </div>
</div>

<script>
  const GOOGLE_WEBAPP_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL"; 

  function handleLogin() {
    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;
    const errorMsg = document.getElementById('login-error');

    if (id === "GSTHE" && pw === "1234") {
      document.getElementById('login-section').classList.remove('active');
      document.getElementById('form-section').classList.add('active');
    } else {
      errorMsg.style.display = 'block';
    }
  }

  let base64Photos = [];
  function previewPhotos(event) {
    const container = document.getElementById('preview-container');
    container.innerHTML = '';
    base64Photos = [];
    const files = event.target.files;

    for (let i = 0; i < files.length; i++) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'preview-img';
        container.appendChild(img);
        
        base64Photos.push({
          fileName: files[i].name,
          mimeType: files[i].type,
          data: e.target.result.split(',')[1]
        });
      }
      reader.readAsDataURL(files[i]);
    }
  }

  function submitData() {
    const storeName = document.getElementById('store-name').value;
    const checkDate = document.getElementById('check-date').value;
    const checkResult = document.getElementById('check-result').value;
    const memo = document.getElementById('memo').value;
    const btn = document.getElementById('submit-btn');

    if (!storeName || !checkDate || !checkResult) {
      alert("필수 항목을 모두 입력해 주세요.");
      return;
    }

    btn.disabled = true;
    btn.innerText = "전송 중...";

    const payload = {
      storeName: storeName,
      checkDate: checkDate,
      checkResult: checkResult,
      memo: memo,
      photos: base64Photos
    };

    fetch(GOOGLE_WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert("성공적으로 제출되었습니다!");
      location.reload();
    })
    .catch(err => {
      alert("제출이 완료되었습니다.");
      location.reload();
    });
  }
</script>

</body>
</html>
